defaults:
  - _self_
  - constants: defaults
  - hydra: default
  - experiment: ??

# Global defaults for the experiment config itself
experiment:
  config:
    do_eval: false
    do_train: false

# Which episodes to run (zero-based). Examples: "all" | "3" | "0,3,5:8" | "4:" | ":8".
episodes: all
# How many episodes to run in parallel
num_parallel: 16
# How many intra-op threads each parallel process may use. More than one per
# process oversubscribes the machine when running many episodes in parallel.
threads_per_process: 1
# Don't run an experiment; just print out the config for visual inspection
# TODO: Replace with validate or similar
print_cfg: false
# Set logging levels in habitat to quiet
quiet_habitat_logs: true
