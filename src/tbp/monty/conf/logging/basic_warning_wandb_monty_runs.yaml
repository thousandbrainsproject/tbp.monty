# @package experiment.config.logging

python_log_level: WARNING
python_log_to_file: true
python_log_to_stderr: true
output_dir: ${path.expanduser:${oc.env:MONTY_LOGS}/projects/monty_runs}

monty_data_logger:
  _target_: tbp.monty.frameworks.loggers.graph_matching_loggers.BasicGraphMatchingLogger
  handlers:
    - _target_: tbp.monty.frameworks.loggers.monty_handlers.BasicCSVStatsHandler
    - _target_: tbp.monty.frameworks.loggers.wandb_handlers.WandbWrapper
      resume_wandb_run: false
      wandb_handlers:
        - _target_: tbp.monty.frameworks.loggers.wandb_handlers.BasicWandbTableStatsHandler
        - _target_: tbp.monty.frameworks.loggers.wandb_handlers.BasicWandbChartStatsHandler
      wandb_id:
        _target_: wandb.util.generate_id
      wandb_group: benchmark_experiments
