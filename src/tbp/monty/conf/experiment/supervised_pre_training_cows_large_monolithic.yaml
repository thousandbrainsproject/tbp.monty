# @package _global_

defaults:
  - /monty: evidencegraph
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: evidence_3lm_heterarchy_pretrain
  - /monty/sensor_module: 3sm_2d3d_dist_slic
  - /monty/connectivity: 3lm_3sm_monolithic
  - /monty/attention_system: default
  - /environment: mujoco_dist_agent_sensors3_256
  - /env_interface: train_cows_large_predefined
  - /env_interface/positioning_procedures_train: getgoodview_viewfinder_patch0
  - /env_interface/transform: gaussianblur_missing_depthto3d_sensor4_256
  - /termination: any3_any_mfgm_t3e3exp1000_t250e500tot500
  - /logging: silent_info_train
  - override /environment/mujoco_assets@experiment.config.environment.env_init_args: cows

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    n_train_epochs: ${constants.rotations_cube_faces_count}
    n_eval_epochs: 3
    model_name_or_path: ${constants.compositional_pretrained_dir}/supervised_pre_training_cows_large_2d_children/pretrained/
    seed: 42
    supervised_lm_ids:
      - learning_module_2
    logging:
      run_name: supervised_pre_training_cows_large_monolithic
