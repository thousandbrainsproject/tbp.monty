# @package _global_

defaults:
  - /monty: graph_exp500_e3_t3_tot2500
  - /monty/motor_system_config: snake_scan
  - /monty/learning_module: displacement_delta_d0001
  - /monty/sensor_module: arc_patch
  - /monty/connectivity: 1lm_1sm
  - /environment: arc
  - /env_interface: train_arc
  - /env_interface/transform: none
  - /logging: silent_info_train

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: 1
    n_eval_epochs: 3
    model_name_or_path: ''
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 1
    seed: 42
    supervised_lm_ids: all
    logging:
      run_name: arc_train

