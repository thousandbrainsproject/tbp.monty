# @package _global_

defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: evidence_3lm_heterarchy
  - /monty/sensor_module: 3sm_2d3d_dist
  - /monty/connectivity: 3lm_3sm_monolithic
  - /environment: mujoco_dist_agent_sensors3
  - /env_interface: eval_expanded_objects_with_stickers_random_locs
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch0
  - /env_interface/transform: gaussianblur_missing_depthto3d_sensor4
  - /logging: basic_warning_wandb_evidence_eval_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 100
    n_train_epochs: 3
    n_eval_epochs: ${constants.rotations_3_count}
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}/pretrained_compositional_objects_v7}/supervised_pre_training_expanded_monolithic_models/pretrained/
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.NamedLMsMatch
      ids:
        - learning_module_2
    recognition_policy:
      _target_: tbp.monty.experiment.recognition_policy.ObjectRecognition
      max_total_steps: 6000
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    environment:
      env_init_args:
        data_path: ${path.expanduser:${oc.env:MONTY_DATA}/compositional_objects_1.4_random_locs_mujoco}
    eval_env_interface_args:
      object_init_sampler:
        _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
        rotations: ${constants.rotations_3}
    logging:
      run_name: base_infer_expanded_objects_with_stickers_monolithic_models_random_locs_mujoco
