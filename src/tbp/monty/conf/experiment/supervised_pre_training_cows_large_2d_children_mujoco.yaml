# @package _global_

defaults:
  - /monty: evidencegraph_exp1000_e3_t3
  - /monty/motor_system_config: naive_scan_1
  - /monty/learning_module: evidence_3lm_heterarchy
  - /monty/sensor_module: 3sm_2d3d_dist
  - /monty/connectivity: 3lm_3sm_heterarchy
  - /environment: mujoco_dist_agent_sensors3
  - /env_interface: train_cows_large_2d_children_predefined
  - /env_interface/positioning_procedures_train: getgoodview_viewfinder_patch0
  - /env_interface/transform: gaussianblur_missing_depthto3d_sensor4
  - /termination: any1_naivescan_fixed1_tot500
  - /logging: silent_info_train

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    skip_on_object_not_visible: true
    show_sensor_output: false
    n_train_epochs: 7
    n_eval_epochs: 7
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}/my_trained_models/supervised_pre_training_cows_3d_children/pretrained/}
    seed: 42
    supervised_lm_ids:
      - learning_module_1
    environment:
      env_init_args:
        data_path: ${path.expanduser:${oc.env:MONTY_DATA}/compositional_objects_1.4_mujoco}
    logging:
      run_name: supervised_pre_training_cows_large_2d_children
