# @package _global_

defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: evidence_3lm_heterarchy
  - /monty/sensor_module: 3sm_2d3d_dist
  - /monty/connectivity: 3lm_3sm_heterarchy
  - /monty/attention_system: default
  - /environment: habitat_dist_agent_sensors3
  - /env_interface: eval_cows_small_predefined
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch0
  - /env_interface/transform: gaussianblur_missing_depthto3d_sensor4
  - /termination: named_lm2_objectrecognition_t1000_e100_tot6000
  - /logging: basic_warning_wandb_evidence_eval_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 3
    n_eval_epochs: ${constants.rotations_all_count}
    model_name_or_path: ${constants.compositional_pretrained_dir}/supervised_pre_training_cows_small_compositional/pretrained/
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    environment:
      env_init_args:
        data_path: ${path.expanduser:${oc.env:MONTY_DATA}/compositional_objects_1.4}
    logging:
      run_name: base_infer_cows_small_compositional
