# @package _global_

defaults:
  - /monty: graph_exp10_e3_t3_tot2500
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: displacement_1lm
  - /monty/sensor_module: camera_dist
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_ycb_dist_agent_256
  - /env_interface: eval_ycb_snapshots
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch
  - /env_interface/transform: missing_depthto3d_sensor2_256_semantic0
  - /logging: detailed_info_monty_runs

# One-step snapshot sweep over every converted YCB object, for
# visually inspecting the MuJoCo conversion via the view finder's raw
# observations.
experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 1
    max_total_steps: 6000
    n_train_epochs: 1
    n_eval_epochs: 1
    model_name_or_path: ""
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 1
    seed: 42
    supervised_lm_ids: []
    python_log_level: INFO
    logging:
      run_name: ycb_snapshots_mujoco
      detailed_save_per_episode: true
      output_dir: ${path.expanduser:'~/tbp/results/comp_benefits_figures'}
    monty_config:
      sensor_modules:
        sensor_module_0:
          save_raw_obs: false
        sensor_module_1:
          save_raw_obs: true
