# @package _global_

defaults:
  - /monty: evidencegraph_exp1000_e3_t3
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: evidence_3lm_heterarchy
  - /monty/sensor_module: 3sm_2d3d_dist_slic
  - /monty/connectivity: 3lm_3sm_heterarchy
  - /monty/attention_system: default
  - /environment: mujoco_dist_agent_sensors3_256
  - /env_interface: train_objects_with_stickers_predefined
  - /env_interface/positioning_procedures_train: getgoodview_viewfinder_patch0
  - /env_interface/transform: gaussianblur_missing_depthto3d_sensor4_256
  - /logging: silent_info_train

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    max_train_steps: 250
    max_eval_steps: 500
    max_total_steps: 500
    n_train_epochs: ${constants.rotations_cube_faces_count}
    n_eval_epochs: 3
    # To save time on training, we use the pretrained models trained on Habitat versions of the 2D and 3D objects - TODO change
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}/my_trained_models/supervised_pre_training_objects_with_stickers_2d_children/pretrained/}
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 3
    seed: 42
    supervised_lm_ids:
      - learning_module_2
    logging:
      run_name: supervised_pre_training_objects_with_stickers_comp_models_mujoco
    monty_config:
      motor_system_config:
        telemetry:
          _target_: tbp.monty.frameworks.models.motor_system_telemetry.NoopMotorSystemTelemetry
      learning_modules:
        learning_module_0:
          region_proposers:
            - _target_: tbp.monty.frameworks.models.evidence_matching.region_proposal.excite_goal_locations.ExciteGoalLocations
          telemetry:
            _target_: tbp.monty.frameworks.models.evidence_matching.telemetry.NoopEvidenceGraphLMTelemetry
          gsg:
            min_post_goal_success_steps: 100
        learning_module_1:
          gsg: null
          # Only report the sticker once its evidence is well clear of the
          # confusable regime. 
          output_min_evidence: 20.0
        learning_module_2:
          region_proposers:
            - _target_: tbp.monty.frameworks.models.evidence_matching.region_proposal.excite_goal_locations.ExciteGoalLocations
          telemetry:
            _target_: tbp.monty.frameworks.models.evidence_matching.telemetry.NoopEvidenceGraphLMTelemetry
          # Only LM_0 generates goals; disable the goal generators of LM_1/LM_2.
          gsg: null
      sensor_modules:
        sensor_module_0:
          # Random rotations often leave the sticker at a steep angle, where the
          # sticker LM stalls. The patch SM asks for a face-on view when the
          # smoothed view angle says the surface sits steeply to the camera
          gsg:
            _target_: tbp.monty.frameworks.models.face_on_reorientation.FaceOnReorientation
            max_view_angle: 60.0
            window: 2
            min_steps_between_goals: 25
          region_proposers:
            - _target_: tbp.monty.frameworks.models.sm_region_proposal.excite_goal_locations.ExciteGoalLocations
        sensor_module_3:
          segmentation_strategy:
            _target_: tbp.monty.frameworks.models.salience.segmentation.strategies.slic_merge.SlicMerge
          # Nothing reads this telemetry during pretraining, and recording every
          # step's frames, maps, and grids exhausts memory over a long run.
          snapshot_telemetry:
            _target_: tbp.monty.frameworks.models.salience.telemetry.NoopSalienceSMTelemetry
      attention_system:
        telemetry:
          _target_: tbp.monty.attention.telemetry.NoopAttentionSystemTelemetry
