# @package _global_

defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: evidence_3lm_heterarchy
  - /monty/sensor_module: 3sm_2d3d_dist_slic
  - /monty/connectivity: 3lm_3sm_monolithic
  - /monty/attention_system: voxel5mm
  - /environment: mujoco_dist_agent_sensors3_256
  - /env_interface: eval_cows_small_predefined
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch0
  - /env_interface/transform: gaussianblur_missing_depthto3d_sensor4_256
  - /termination: named_lm2_objectrecognition_t1000_e100_tot500
  - /logging: basic_warning_wandb_evidence_eval_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 3
    n_eval_epochs: ${constants.rotations_all_count}
    model_name_or_path: ${constants.compositional_pretrained_dir}/supervised_pre_training_cows_small_monolithic/pretrained/
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    environment:
      env_init_args:
        data_path: ${path.expanduser:${oc.env:MONTY_DATA}/compositional_objects_1.4_mujoco}
    logging:
      run_name: base_infer_cows_small_monolithic_mujoco
    monty_config:
      learning_modules:
        # During inference only the parent LM (LM_2) generates goals.
        learning_module_0:
          gsg: null
        learning_module_1:
          gsg: null
          max_match_distance: 0.0025
          # Lower floor than in training so logo IDs reach LM_2 sooner.
          output_min_evidence: 5.0
        learning_module_2:
          gsg:
            min_post_goal_success_steps: 20
