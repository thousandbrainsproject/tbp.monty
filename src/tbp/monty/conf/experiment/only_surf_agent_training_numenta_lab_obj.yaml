# @package _global_

defaults:
  - /monty: graph_exp1000_e3_t3
  - /monty/motor_system_config: surface_curvature_informed_goal0
  - /monty/learning_module: displacement_delta
  - /monty/sensor_module: camera_surf_rgba
  - /monty/connectivity: 1lm_1sm
  - /environment: habitat_numentalab_surf_agent
  - /env_interface: train_numentalabobj_predefined
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_maxtotalsteps_6000
  - /logging: silent_warning_train

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    n_train_epochs: ${constants.rotations_all_count}
    n_eval_epochs: 3
    model_name_or_path: ''
    seed: 42
    supervised_lm_ids: all
    logging:
      run_name: surf_agent_1lm_numenta_lab_obj
