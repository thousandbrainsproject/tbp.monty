# @package _global_

defaults:
  - /monty: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: evidence_1lm_burst_gsg0
  - /monty/sensor_module: 1sm_camera_dist_vocus2_slic
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_ycb_dist_agent_256
  - /env_interface: eval_fate_attenzione
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_256
  - /logging: basic_info_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: true
    max_train_steps: 1000
    max_eval_steps: 50
    max_total_steps: 100
    n_train_epochs: 3
    n_eval_epochs: 1
    model_name_or_path: ${constants.pretrained_dir}/surf_agent_1lm_77obj/pretrained/
    min_lms_match: 1
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: potato
      detailed_save_per_episode: true
    monty_config:
      sensor_modules:
        sensor_module_0:
          save_raw_obs: false
        sensor_module_1:
          save_raw_obs: false
