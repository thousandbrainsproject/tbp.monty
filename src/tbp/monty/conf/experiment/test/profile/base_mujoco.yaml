# @package _global_

defaults:
  - /monty: base_exp1000_e3_t3
  - /monty/motor_system_config: base
  - /monty/learning_module: fake_1lm
  - /monty/sensor_module: fake
  - /monty/connectivity: test_1lm_1sm
  - /environment: test_mujoco
  - /env_interface: test_train_3obj_default_eval_3obj_default
  - /env_interface/transform: none
  - /termination: test_any1_montyisdone
  - /logging: base_info_monty_runs

experiment:
  # TODO: Remove "mujoco" when this replaces the Habitat version
  _target_: tests.mujoco.integration.frameworks.experiments.profile_experiment_mixin_test.ProfiledExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 1
    n_eval_epochs: 1
    model_name_or_path: ''
    seed: 42
    supervised_lm_ids: []
    logging:
      run_name: ""
