# @package experiment.config

match_criterion:
  _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
  count: 1
recognition_strategy:
  _target_: tbp.monty.experiment.recognition_strategy.MinEvalMaxTotalSteps
  min_eval_steps: 20
  max_total_steps: 5000
  wrapped:
    _target_: tbp.monty.experiment.recognition_strategy.Any
    strategies:
    - _target_: tbp.monty.experiment.recognition_strategy.MontyForGraphMatchingSetStepTypeAndCheckIfDone
      match_criterion:
        _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
        count: 1
      min_train_steps: 3
      min_eval_steps: 20
      num_exploratory_steps: 1000
    - _target_: tbp.monty.experiment.recognition_strategy.StepLimit
      min_train_steps: 3
      num_exploring_steps: 1000
      max_train_steps: 1000
      max_eval_steps: 500
    - _target_: tbp.monty.experiment.recognition_strategy.MatchCriteria
