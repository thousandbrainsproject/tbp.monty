# @package experiment.config

match_criterion:
  _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
  count: 1
recognition_strategy:
  _target_: tbp.monty.experiment.recognition_strategy.Any
  strategies:
    - _target_: tbp.monty.experiment.recognition_strategy.MontyForGraphMatchingSetStepTypeAndCheckIfDone
      match_criterion:
        _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
        count: 1
      min_train_steps: 3
      min_eval_steps: 3
      num_exploratory_steps: 1000
    - _target_: tbp.monty.experiment.recognition_strategy.MontyIsDone
    - _target_: tbp.monty.experiment.recognition_strategy.NaiveScan
      fixed_amount: 1
    - _target_: tbp.monty.experiment.recognition_strategy.MaxTotalSteps
      max_total_steps: 500
