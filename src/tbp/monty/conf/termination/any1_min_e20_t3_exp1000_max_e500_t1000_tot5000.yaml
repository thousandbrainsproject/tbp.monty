# @package experiment.config

match_criterion:
  _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
  count: 1
recognition_policy:
  _target_: tbp.monty.experiment.recognition_policy.MinEvalMaxTotalSteps
  min_eval_steps: 20
  max_total_steps: 5000
  wrapped:
    _target_: tbp.monty.experiment.recognition_policy.AnyPolicy
    policies:
    - _target_: tbp.monty.experiment.recognition_policy.StepLimit
      min_train_steps: 3
      num_exploring_steps: 1000
      max_train_steps: 1000
      max_eval_steps: 500
    - _target_: tbp.monty.experiment.recognition_policy.MatchCriteria
