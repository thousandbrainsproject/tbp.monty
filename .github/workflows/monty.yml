name: Monty

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

jobs:
  build_sphinx_monty:
    name: build-sphinx-monty
    runs-on:
      group: tbp.monty
      labels: tbp-linux-x64-ubuntu2204-2core
    needs:
      - check_dependencies_monty # Don't run if dependency check fails
      - check_license_monty # Don't run if license check fails
      - check_style_monty # Don't run if style check fails
      - check_types_monty # Don't run if type check fails
      - should_run_monty
    steps:
      - name: Checkout tbp.monty
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: tbp.monty
      - name: Install uv
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Build API docs
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        working-directory: tbp.monty
        run: |
          cd tools/generate_api_docs
          uv run --frozen --extra dev --extra generate_api_docs_tool make apidoc html
      - name: Store API docs artifact
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-html-${{ github.sha }}
          path: tbp.monty/tools/generate_api_docs/build/html

  check_dependencies_monty:
    name: check-dependencies-monty
    runs-on:
      group: tbp.monty
      labels: tbp-linux-x64-ubuntu2204-2core
    needs:
      - should_run_monty
    steps:
      - name: Checkout tbp.monty
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: tbp.monty
      - name: Install uv
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Check dependencies
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        working-directory: tbp.monty
        run: |
          uv run --frozen --extra dev deptry src tests

  check_license_monty:
    name: check-license-monty
    runs-on: ubuntu-latest
    needs: should_run_monty
    steps:
      - name: Checkout tbp.monty
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: tbp.monty
      - name: Check license
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        working-directory: tbp.monty
        run: |
          FILES=$(grep -l -r ' GNU \| MPL \| Mozilla ' * ) || true
          if [ -n "$FILES" ]; then
            echo "Found Copyleft Licensed files: $FILES"
            exit 1
          fi

  check_style_monty:
    name: check-style-monty
    runs-on:
      group: tbp.monty
      labels: tbp-linux-x64-ubuntu2204-2core
    needs:
      - should_run_monty
    steps:
      - name: Checkout tbp.monty
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: tbp.monty
      - name: Install uv
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Check style
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        working-directory: tbp.monty
        run: |
          mkdir -p test_results/ruff
          uv run --frozen --extra dev ruff check src tests run.py run_parallel.py
          uv run --frozen --extra dev ruff format --check src tests run.py run_parallel.py
      - name: Changed files for a pull request
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' && github.event_name == 'pull_request' }}
        working-directory: tbp.monty
        run: |
          git diff --name-only origin/${{ github.base_ref }}... > changed_files.txt
      - name: Changed files for a push
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' && github.event_name == 'push' }}
        working-directory: tbp.monty
        run: |
          git diff --name-only ${{ github.sha }}^1 > changed_files.txt
      - name: Changed files for a merge group
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' && github.event_name == 'merge_group' }}
        working-directory: tbp.monty
        run: |
          git diff --name-only ${{ github.event.merge_group.head_sha }}^1 > changed_files.txt
      - name: Check Copyright 2026
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        working-directory: tbp.monty
        run: |
          cat changed_files.txt | grep -E '^src/|^tests/|^run.py$|^run_parallel.py$' | grep '\.py$' > changed_files_filtered.txt || exit 0
          if ! cat changed_files_filtered.txt | xargs uv run --frozen --extra dev ruff check --select CPY001 --config lint.flake8-copyright.notice-rgx='"Copyright\\s+.*2026"' -v
          then
            echo "One or more modified files did not update the copyright date range to include the current year."
            echo "See https://docs.thousandbrains.org/docs/code-style-guide#source-code-copyright-and-license-header for details."
            exit 1
          fi

  check_types_monty:
    name: check-types-monty
    runs-on:
      group: tbp.monty
      labels: tbp-linux-x64-ubuntu2204-2core
    needs:
      - should_run_monty
    steps:
      - name: Checkout tbp.monty
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: tbp.monty
      - name: Install uv
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Check types
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        continue-on-error: true # Accept type errors for now
        working-directory: tbp.monty
        run: |
          mkdir -p test_results/mypy
          uv run --frozen --extra dev mypy src tests

  should_run_monty:
    name: should-run-monty
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'thousandbrainsproject' }}
    outputs:
      should_run_monty: ${{ steps.should_run_monty.outputs.should_run_monty }}
    steps:
      - name: Checkout tbp.monty
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: tbp.monty
      - name: Should Run Monty
        id: should_run_monty
        uses: ./tbp.monty/.github/actions/should_run_monty
        with:
          git_base_ref: ${{ github.base_ref }}
          git_sha: ${{ github.event.merge_group.head_sha || github.sha }}
          github_event_name: ${{ github.event_name }}
          working_directory: tbp.monty

  test_integration_monty:
    name: test-integration-monty
    runs-on:
      group: tbp.monty
      labels: tbp-linux-x64-ubuntu2204-8core
    timeout-minutes: 120
    needs:
      - should_run_monty
      - test_monty
    steps:
      - name: Checkout tbp.monty
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: actions/checkout@v7
        with:
          path: tbp.monty
      - name: Install dependencies
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends libegl1-mesa-dev
      - name: Install uv
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Create uv environment
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        working-directory: tbp.monty
        run: |
          uv sync --locked --extra dev --extra simulator_mujoco
      - name: Run tests
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        working-directory: tbp.monty
        run: |
          export MUJOCO_GL=egl
          export EGL_PLATFORM=headless
          mkdir -p test_results/pytest
          uv run --frozen pytest tests/integration tests/mujoco/integration \
            --cov --cov-context=test --cov-report html --cov-report term \
            --junitxml=test_results/pytest/results.xml --verbose \
            --durations=10 --durations-min=60
      - name: Store test results
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: test_results_uv_integration
          path: tbp.monty/test_results/pytest
      - name: Store coverage
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: test_coverage_uv_integration
          path: tbp.monty/htmlcov


  test_monty:
    name: test-monty
    runs-on:
      group: tbp.monty
      labels: tbp-linux-x64-ubuntu2204-8core
    timeout-minutes: 120
    needs:
      # TODO: check all these using `uv` once we move off Conda
      - check_dependencies_monty # Don't run if dependency check fails
      - check_style_monty # Don't run if style check fails
      - check_types_monty # Don't run if type check fails
      - should_run_monty
    steps:
      - name: Checkout tbp.monty
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: actions/checkout@v7
        with:
          path: tbp.monty
      - name: Install dependencies
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends libegl1-mesa-dev
      - name: Install uv
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Create uv environment
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        working-directory: tbp.monty
        run: |
          uv sync --locked --extra dev --extra simulator_mujoco
      - name: Run tests
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        working-directory: tbp.monty
        run: |
          export MUJOCO_GL=egl
          export EGL_PLATFORM=headless
          mkdir -p test_results/pytest
          uv run --frozen pytest src tests/mujoco/conf tests/unit \
            --cov --cov-context=test --cov-report html --cov-report term \
            --junitxml=test_results/pytest/results.xml --verbose \
            --doctest-modules --doctest-continue-on-failure \
            --ignore=src/tbp/monty/simulators/habitat \
            --ignore=src/tbp/monty/simulators/tacto \
            --durations=10 --durations-min=60
      - name: Store test results
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: test_results_uv
          path: tbp.monty/test_results/pytest
      - name: Store coverage
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: test_coverage_uv
          path: tbp.monty/htmlcov

  test_tutorials_monty:
    name: test-tutorials-monty
    runs-on:
      group: tbp.monty
      labels: tbp-linux-x64-ubuntu2204-8core
    timeout-minutes: 120
    needs:
      - should_run_monty
      - test_monty
    steps:
      - name: Checkout tbp.monty
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: actions/checkout@v7
        with:
          path: tbp.monty
      - name: Install dependencies
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends libegl1-mesa-dev
      - name: Download data for tutorials
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        working-directory: tbp.monty
        run: |
          set -e
          mkdir -p ~/tbp/data/mujoco/objects/ycb
          curl -L https://tbp-data-public-5e789bd48e75350c.s3.us-east-2.amazonaws.com/tbp.monty/ycb_objects_1.0.tgz | tar -xzf - -C ~/tbp/data/mujoco/objects/ycb
          git clone --depth 1 https://github.com/brendenlake/omniglot.git ~/tbp/data/omniglot
          unzip -qq ~/tbp/data/omniglot/python/images_background.zip -d ~/tbp/data/omniglot/python
          unzip -qq ~/tbp/data/omniglot/python/strokes_background.zip -d ~/tbp/data/omniglot/python
          mkdir -p ~/tbp/data/worldimages
          curl -L https://tbp-data-public-5e789bd48e75350c.s3.us-east-2.amazonaws.com/tbp.monty/worldimages.tgz | tar -xzf - -C ~/tbp/data
          mkdir -p ~/tbp/results/monty/pretrained_models/pretrained_ycb_v14
          curl -L https://tbp-pretrained-models-public-c9c24aef2e49b897.s3.us-east-2.amazonaws.com/tbp.monty/pretrained_ycb_v14.tgz | tar -xzf - -C ~/tbp/results/monty/pretrained_models
      - name: Install uv
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Create uv environment
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        working-directory: tbp.monty
        run: |
          uv sync --locked --extra dev --extra simulator_mujoco
      - name: Test tutorials
        if: ${{ needs.should_run_monty.outputs.should_run_monty == 'true' }}
        working-directory: tbp.monty
        run: |
          export MUJOCO_GL=egl
          export EGL_PLATFORM=headless
          set -e
          mkdir -p test_results/pytest
          uv run --frozen pytest tests/mujoco/tutorials \
            --cov --cov-context test --cov-report html --cov-report term \
            --junitxml=test_results/pytest/results.xml \
            --verbose \
            --durations=10 --durations-min=60
