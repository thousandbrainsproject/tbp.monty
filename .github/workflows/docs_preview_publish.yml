name: Docs Preview Publish

on:
  workflow_run:
    workflows: [Docs Preview Render]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  find_pr:
    if: >-
      ${{
        github.repository_owner == 'thousandbrainsproject' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr_number: ${{ steps.source.outputs.pr_number }}
      head_sha: ${{ steps.source.outputs.head_sha }}
    steps:
      - name: Find the current PR
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!run.head_repository || !run.head_branch) return;

            const prs = await github.paginate(
              github.rest.pulls.list,
              {
                ...context.repo,
                state: 'open',
                base: 'main',
                head: `${run.head_repository.owner.login}:${run.head_branch}`,
              },
            );

            const matches = prs.filter(pr =>
              pr.head.repo?.id === run.head_repository.id &&
              pr.head.ref === run.head_branch &&
              pr.head.sha === run.head_sha
            );

            if (matches.length === 0) {
              core.notice('No current open PR matches this run; skipping publish.');
              return;
            }
            if (matches.length !== 1) {
              throw new Error('Ambiguous PR association');
            }
            const pr = matches[0];

            core.setOutput('pr_number', pr.number);
            core.setOutput('head_sha', pr.head.sha);

  docs_preview_publish:
    name: docs-preview-publish
    needs: find_pr
    if: ${{ needs.find_pr.outputs.pr_number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: monty-readme-preview-${{ needs.find_pr.outputs.pr_number }}
      queue: max
    env:
      PR_NUMBER: ${{ needs.find_pr.outputs.pr_number }}
      PR_HEAD_SHA: ${{ needs.find_pr.outputs.head_sha }}
    steps:
      - name: Recheck PR before publishing
        id: current
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (
              pr.state !== 'open' ||
              pr.base.ref !== 'main' ||
              pr.head.sha !== process.env.PR_HEAD_SHA
            ) {
              core.notice('The PR changed while waiting to publish. Skipping.');
              return;
            }
            core.setOutput('ready', 'true');

      - name: Checkout tbp.monty
        if: ${{ steps.current.outputs.ready == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: tbp.monty
          persist-credentials: false

      - name: Create initial PR comment
        if: ${{ steps.current.outputs.ready == 'true' }}
        uses: ./tbp.monty/.github/actions/pin_comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_number: ${{ needs.find_pr.outputs.pr_number }}
          comment_id: docs-preview
          working_directory: tbp.monty
          message: |
            📚 **Documentation Preview**

            Publishing documentation preview... ⏳

            Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for progress.

      - name: Install uv
        if: ${{ steps.current.outputs.ready == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Get preview version and date
        if: ${{ steps.current.outputs.ready == 'true' }}
        id: preview_info
        working-directory: tbp.monty
        run: |
          minor=$(uv run --frozen --extra print_version_tool python -m tools.print_version.cli minor)
          version=$(uv run --frozen --extra github_readme_sync_tool \
            python -m tools.github_readme_sync.cli preview-version "$minor" "$PR_NUMBER")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'date=%s\n' "$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Download preview artifact
        if: ${{ steps.current.outputs.ready == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: docs-preview-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/docs-preview-artifact

      - name: Publish preview
        if: ${{ steps.current.outputs.ready == 'true' }}
        id: publish
        working-directory: tbp.monty
        env:
          README_API_KEY: ${{ secrets.README_API_KEY }}
          PREVIEW_VERSION: ${{ steps.preview_info.outputs.version }}
        run: |
          uv run --frozen --extra github_readme_sync_tool --extra print_version_tool \
            python -m tools.github_readme_sync.cli \
            publish-preview \
            "${{ runner.temp }}/docs-preview-artifact/preview.json" \
            "$PREVIEW_VERSION" \
            --expected-repository "${{ github.repository }}" \
            --expected-pr-number "$PR_NUMBER" \
            --expected-head-sha "$PR_HEAD_SHA" \
            --expected-base-ref main

      - name: Update PR comment on success
        if: ${{ steps.publish.outcome == 'success' }}
        uses: ./tbp.monty/.github/actions/pin_comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_number: ${{ needs.find_pr.outputs.pr_number }}
          comment_id: docs-preview
          working_directory: tbp.monty
          message: |
            📚 **Documentation Preview**

            ✅ A preview of the documentation changes in this PR is available for maintainers at:
            ${{ vars.DOCS_URL_PREFIX }}v${{ steps.preview_info.outputs.version }}

            Last updated: ${{ steps.preview_info.outputs.date }}

      - name: Update PR comment on failure
        if: ${{ failure() && steps.current.outputs.ready == 'true' }}
        uses: ./tbp.monty/.github/actions/pin_comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_number: ${{ needs.find_pr.outputs.pr_number }}
          comment_id: docs-preview
          working_directory: tbp.monty
          message: |
            📚 **Documentation Preview**

            ❌ Failed to publish documentation preview.

            Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
