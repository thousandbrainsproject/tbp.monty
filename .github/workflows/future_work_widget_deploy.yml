name: Future Work Widget Deploy

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'docs/future-work/**'
      - 'docs/snippets/**'
      - 'tools/future_work_widget/**'
      - '.github/workflows/future_work_widget_deploy.yml'

jobs:
  future_work_widget_deploy:
    name: future-work-widget-deploy
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'thousandbrainsproject' }}
    steps:
      - name: Checkout tbp.monty
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: tbp.monty
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Build future work widget
        working-directory: tbp.monty
        run: |
          uv run --frozen \
            --extra dev \
            --extra github_readme_sync_tool \
            --extra future_work_widget_tool \
            python -m tools.github_readme_sync.cli generate-index docs "${{ runner.temp }}/index.json"
          mkdir -p "${{ runner.temp }}/future-work-widget"
          cp -r tools/future_work_widget/app/* "${{ runner.temp }}/future-work-widget/"
          uv run --frozen \
            --extra dev \
            --extra github_readme_sync_tool \
            --extra future_work_widget_tool \
            python -m tools.future_work_widget.cli "${{ runner.temp }}/index.json" "${{ runner.temp }}/future-work-widget"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.FUTUREWORK_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FUTUREWORK_SECRET_ACCESS_KEY }}
          aws-region: ${{ 'us-east-1' }}
      - name: Upload future work widget to S3
        run: |
          # Called twice to prevent downtime during deployment.
          # First sync to ensure new files are uploaded.
          # Second sync to delete any files that are no longer in the source directory.
          aws s3 sync "${{ runner.temp }}/future-work-widget/" s3://${{ secrets.FUTUREWORK_S3_BUCKET_NAME }}/
          aws s3 sync "${{ runner.temp }}/future-work-widget/" s3://${{ secrets.FUTUREWORK_S3_BUCKET_NAME }}/ --delete
