name: Docs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

jobs:
  check_docs:
    name: check-docs
    runs-on: ubuntu-latest
    needs:
      - should_run_docs
    steps:
      - name: Checkout tbp.monty
        if: ${{ needs.should_run_docs.outputs.should_run_docs == 'true' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: tbp.monty
      - name: lint-docs
        if: ${{ needs.should_run_docs.outputs.should_run_docs == 'true' }}
        uses: ./tbp.monty/.github/actions/vale_linter
        with:
          path: tbp.monty
      - name: Install uv
        if: ${{ needs.should_run_docs.outputs.should_run_docs == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Set up ~/tbp
        if: ${{ needs.should_run_docs.outputs.should_run_docs == 'true' }}
        run: |
          mkdir -p ~/tbp
          ln -s $GITHUB_WORKSPACE/tbp.monty ~/tbp/tbp.monty
      - name: Check docs
        if: ${{ needs.should_run_docs.outputs.should_run_docs == 'true' }}
        working-directory: tbp.monty
        run: |
          uv run --frozen \
            --extra dev \
            --extra github_readme_sync_tool \
            python -m tools.github_readme_sync.cli check docs

  should_run_docs:
    name: should-run-docs
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'thousandbrainsproject' }}
    outputs:
      should_run_docs: ${{ steps.should_run_docs.outputs.should_run_docs }}
    steps:
      - name: Checkout tbp.monty
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: tbp.monty
      - name: Should Run Docs
        id: should_run_docs
        uses: ./tbp.monty/.github/actions/should_run_docs
        with:
          git_base_ref: ${{ github.base_ref }}
          git_sha: ${{ github.event.merge_group.head_sha || github.sha }}
          github_event_name: ${{ github.event_name }}
          working_directory: tbp.monty
