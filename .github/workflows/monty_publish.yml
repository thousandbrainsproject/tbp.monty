name: Monty Publish

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Monty]
    types:
      - completed
    branches:
      - main

jobs:

  pypi_publish:
    name: pypi-publish
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout tbp.monty
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          path: tbp.monty
      - name: Version updated
        id: version_updated
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: ./tbp.monty/.github/actions/version_updated
        with:
          git_sha: ${{ github.sha }}
          working_directory: tbp.monty
      - name: Install uv
        if: ${{ steps.version_updated.outputs.version_updated == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Create uv environment
        if: ${{ steps.version_updated.outputs.version_updated == 'true' || github.event_name == 'workflow_dispatch' }}
        working-directory: tbp.monty
        run: |
          uv sync --locked --extra dev --extra simulator_mujoco
          uv pip install build
      - name: Build the package
        if: ${{ steps.version_updated.outputs.version_updated == 'true' || github.event_name == 'workflow_dispatch' }}
        working-directory: tbp.monty
        run: |
          uv run python -m build
      - name: Publish the package to PyPI
        if: ${{ steps.version_updated.outputs.version_updated == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: tbp.monty/dist/


  tag_version_monty_publish:
    name: tag-version-monty-publish
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on:
      group: tbp.monty
      labels: tbp-linux-x64-ubuntu2204-2core
    permissions:
      contents: write
    steps:
      - name: Checkout tbp.monty
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          path: tbp.monty
      - name: Version updated
        id: version_updated
        uses: ./tbp.monty/.github/actions/version_updated
        with:
          git_sha: ${{ github.sha }}
          working_directory: tbp.monty
      - name: Tag version
        if: ${{ steps.version_updated.outputs.version_updated == 'true' }}
        working-directory: tbp.monty
        run: |
          git checkout ${{ github.sha }}
          git tag v${{ steps.version_updated.outputs.version }}
          git push origin v${{ steps.version_updated.outputs.version }}
