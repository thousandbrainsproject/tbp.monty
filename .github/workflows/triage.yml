name: Triage
on:
  pull_request_target:
    branches:
    - main
    types:
    - edited
    - labeled
    - opened
    - unlabeled
    - synchronize

permissions:
  pull-requests: write

jobs:
  pr_title_triage:
    name: pr-title-triage
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          # Store in an environment variable to prevent trying to
          # run backticked strings in the title.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -e

          pattern="^(build|chore|ci|docs|feat|fix|perf|refactor|revert|rfc|style|test)!?:.+"
          if [[ ! $PR_TITLE =~ $pattern ]]; then
            echo "This PR title is missing a Conventional Commits label."
            echo "A maintainer will update it appropriately during triage."
            echo "See https://docs.thousandbrains.org/docs/triage#title-1"
            exit 1
          fi

          pattern="^(test|docs)!:.+"
          if [[ $PR_TITLE =~ $pattern ]]; then
            echo "This PR title indicates it is only changing tests or documentation, and"
            echo "that those changes are breaking changes. Changes that"
            echo "only change files in 'tests' or 'docs' cannot produce breaking"
            echo "changes."
            echo "  If this PR has non-test or non-docs changes, then 'test' or 'docs' is not the"
            echo "correct label for this PR."
            exit 1
          fi

  pr_labels_triage:
    name: pr-labels-triage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tbp.monty
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          path: tbp.monty
      - name: reads as generated label is present
        if: ${{ contains(github.event.pull_request.labels.*.name, 'reads as generated') }}
        uses: ./tbp.monty/.github/actions/pin_comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_number: ${{ github.event.pull_request.number }}
          comment_id: reads-as-generated
          working_directory: tbp.monty
          message: |
            Thank you for your contribution. While this may not have been your intention, this contribution reads as generated by an LLM to a degree that Maintainers will not review it further. We might be wrong. If this is the case, our apologies, and please let us know we made a mistake. For our general guidance on the use of AI/LLMs, please see [Large Language Model Use](https://docs.thousandbrains.org/docs/large-language-model-use).
      - name: triaged label is present
        if: ${{ contains(github.event.pull_request.labels.*.name, 'triaged') }}
        run: |
          echo "This PR has been triaged."
          exit 0
      - name: triaged label is absent
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'triaged') }}
        run: |
          echo "This PR is missing the 'triaged' label."
          echo "A maintainer will apply it during triage."
          echo "See https://docs.thousandbrains.org/docs/triage#labels-1"
          exit 1
