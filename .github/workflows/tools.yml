name: Tools

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

jobs:

  should_run_tools:
    name: should-run-tools
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'thousandbrainsproject' }}
    outputs:
      should_run_tools: ${{ steps.should_run_tools.outputs.should_run_tools }}
    steps:
      - name: Checkout tbp.monty
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: tbp.monty
      - name: Should Run Tools
        id: should_run_tools
        uses: ./tbp.monty/.github/actions/should_run_tools
        with:
          git_base_ref: ${{ github.base_ref }}
          git_sha: ${{ github.event.merge_group.head_sha || github.sha }}
          github_event_name: ${{ github.event_name }}
          working_directory: tbp.monty

  test_tools:
    name: test-tools
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'thousandbrainsproject' }}
    needs:
      - should_run_tools
    steps:
      - name: Checkout tbp.monty
        if: ${{ needs.should_run_tools.outputs.should_run_tools == 'true' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: tbp.monty
      - name: Set up ~/tbp
        if: ${{ needs.should_run_tools.outputs.should_run_tools == 'true' }}
        run: |
          mkdir -p ~/tbp
          ln -s $GITHUB_WORKSPACE/tbp.monty ~/tbp/tbp.monty
      - name: Install uv
        if: ${{ needs.should_run_tools.outputs.should_run_tools == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Check style
        if: ${{ needs.should_run_tools.outputs.should_run_tools == 'true' }}
        working-directory: tbp.monty
        run: |
          uv run --frozen \
            --extra dev \
            --extra github_readme_sync_tool \
            --extra print_version_tool \
            --extra generate_api_docs_tool \
            --extra future_work_widget_tool \
            ruff check tools
          uv run --frozen \
            --extra dev \
            --extra github_readme_sync_tool \
            --extra print_version_tool \
            --extra generate_api_docs_tool \
            --extra future_work_widget_tool \
            ruff format --check tools
      - name: Check types
        if: ${{ needs.should_run_tools.outputs.should_run_tools == 'true' }}
        continue-on-error: true # Accept type errors for now
        working-directory: tbp.monty
        run: |
          uv run --frozen \
            --extra dev \
            --extra github_readme_sync_tool \
            --extra print_version_tool \
            --extra generate_api_docs_tool \
            --extra future_work_widget_tool \
            mypy tools
      - name: Check dependencies
        if: ${{ needs.should_run_tools.outputs.should_run_tools == 'true' }}
        working-directory: tbp.monty
        run: |
          uv run --frozen \
            --extra dev \
            --extra github_readme_sync_tool \
            --extra print_version_tool \
            --extra generate_api_docs_tool \
            --extra future_work_widget_tool \
            deptry src tools
      - name: Run tests
        if: ${{ needs.should_run_tools.outputs.should_run_tools == 'true' }}
        working-directory: tbp.monty
        run: |
          uv run --frozen \
            --extra dev \
            --extra github_readme_sync_tool \
            --extra print_version_tool \
            --extra generate_api_docs_tool \
            --extra future_work_widget_tool \
            pytest tools --doctest-modules --doctest-continue-on-failure
