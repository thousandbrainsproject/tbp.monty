experiment:
  config:
    do_eval: false
    do_train: true
    monty_config:
      monty_class: ${monty.class:tbp.monty.frameworks.models.evidence_matching.model.MontyForEvidenceGraphMatching}
      monty_args:
        num_exploratory_steps: 1000
        min_eval_steps: 3
        min_train_steps: 3
        max_total_steps: 2500
      motor_system_config:
        policy_selector:
          policy:
            _target_: tbp.monty.frameworks.models.motor_policies.SnakeScanPolicy
            agent_id: agent_id_0
            sensor_id: patch_0
            frame_sensor_id: view_finder
            frame_size: null
            patch_size: 1
            stride: 1
          _target_: tbp.monty.frameworks.models.motor_policy_selectors.SinglePolicySelector
        _target_: tbp.monty.frameworks.models.motor_system.MotorSystem
      learning_modules:
        learning_module_0:
          _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
          max_match_distance: 1.0
          tolerances:
            patch_0:
              palette_index: ${np.array:[1.0]}
          feature_weights:
            patch_0:
              palette_index: ${np.array:[1.0]}
          max_graph_size: 128
          num_model_voxels_per_dim: 128
          max_nodes_per_graph: 4096
          object_evidence_threshold: 3
        learning_module_1:
          _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
          max_match_distance: 1.0
          tolerances:
            patch_1:
              palette_index: ${np.array:[1.0]}
            learning_module_0:
              object_id: 1
          feature_weights:
            patch_1:
              palette_index: ${np.array:[1.0]}
            learning_module_0:
              object_id: 1
          max_graph_size: 128
          num_model_voxels_per_dim: 128
          max_nodes_per_graph: 4096
          object_evidence_threshold: 3
      sensor_modules:
        sensor_module_0:
          _target_: tbp.monty.frameworks.models.arc_sprite_pixel_sensor_module.ArcSpritePixelSensorModule
          sensor_module_id: patch_0
        sensor_module_1:
          _target_: tbp.monty.frameworks.models.arc_sprite_pixel_sensor_module.ArcSpritePixelSensorModule
          sensor_module_id: patch_1
        sensor_module_2:
          _target_: tbp.monty.frameworks.models.sensor_modules.Probe
          sensor_module_id: view_finder
          save_raw_obs: true
      sm_to_agent_dict:
        patch_0: agent_id_0
        patch_1: agent_id_0
        view_finder: agent_id_0
      sm_to_lm_matrix:
      - - 0
      - - 1
      lm_to_lm_matrix:
      - []
      - - 0
      lm_to_lm_vote_matrix: null
    environment:
      env_init_args:
        data_path: ./arc_agi/games
        game_id: ls20
        agents:
        - _target_: tbp.monty.simulators.arc_agi.agents.ArcAgent
          _partial_: true
          agent_id: agent_id_0
          viewport_sensor_id: view_finder
          sensor_configs:
            patch_0:
              position:
              - 0
              - 0
              - 0
            patch_1:
              position:
              - 0
              - 0
              - 0
            view_finder:
              position:
              - 0
              - 0
              - 0
          patch_resolution:
            width: 1
            height: 1
      env_init_func: ${monty.class:tbp.monty.simulators.arc_agi.ArcAgiSimulator}
      transform: null
    train_env_interface_args:
      object_names:
      - sm00
      - sm01
      - ar25
      - bp35
      - cd82
      - cn04
      - dc22
      - ft09
      - g50t
      - ka59
      - lf52
      - lp85
      - ls20
      - m0r0
      - r11l
      - re86
      - s5i5
      - sb26
      - sc25
      - sk48
      - sp80
      - su15
      - tn36
      - tr87
      - tu93
      - vc33
      - wa30
      object_init_sampler:
        _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
        rotations:
        - - 0
          - 0
          - 0
    train_env_interface_class: ${monty.class:tbp.monty.experiment.environment.OneObjectPerEpisodeInterface}
    logging:
      monty_log_level: SILENT
      monty_handlers: []
      wandb_handlers: []
      python_log_level: INFO
      python_log_to_file: true
      python_log_to_stderr: true
      output_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/my_trained_models}
      resume_wandb_run: false
      wandb_id:
        _target_: wandb.util.generate_id
      wandb_group: debugging
      run_name: supervised_pre_training_arc_comp_models
    show_sensor_output: false
    max_train_steps: 6000
    max_eval_steps: 6000
    max_total_steps: 6000
    n_train_epochs: 1
    n_eval_epochs: 1
    model_name_or_path: ${constants.arc_pretrained_dir}/supervised_pre_training_arc_sprite_children/pretrained/
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.NamedLMsMatch
      ids:
      - learning_module_1
    seed: 42
    supervised_lm_ids:
    - learning_module_1
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
episodes: all
num_parallel: 16
print_cfg: false
quiet_habitat_logs: true
constants:
  default_all_noise_params:
    features:
      pose_vectors: 2
      hsv: 0.1
      principal_curvatures_log: 0.1
      pose_fully_defined: 0.01
    location: 0.002
  default_sensor_features:
  - pose_vectors
  - pose_fully_defined
  - on_object
  - hsv
  - principal_curvatures_log
  min_eval_steps: 20
  pretrained_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/pretrained_ycb_v13}
  compositional_pretrained_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/pretrained_compositional_objects_v5}
  arc_pretrained_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/my_trained_models}
  rotations_all_count: 14
  rotations_all:
  - - 0
    - 0
    - 0
  - - 0
    - 90
    - 0
  - - 0
    - 180
    - 0
  - - 0
    - 270
    - 0
  - - 90
    - 0
    - 0
  - - 90
    - 180
    - 0
  - - 35
    - 45
    - 0
  - - 325
    - 45
    - 0
  - - 35
    - 315
    - 0
  - - 325
    - 315
    - 0
  - - 35
    - 135
    - 0
  - - 325
    - 135
