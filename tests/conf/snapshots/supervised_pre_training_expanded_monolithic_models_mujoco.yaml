experiment:
  config:
    do_eval: false
    do_train: true
    monty_config:
      monty_class: ${monty.class:tbp.monty.frameworks.models.evidence_matching.model.MontyForEvidenceGraphMatching}
      monty_args:
        num_exploratory_steps: 1000
        min_eval_steps: 3
        min_train_steps: 3
      motor_system_config:
        policy_selector:
          policy:
            action_sampler:
              _target_: tbp.monty.frameworks.actions.action_samplers.ConstantSampler
              actions:
              - ${monty.class:tbp.monty.frameworks.actions.actions.LookUp}
              - ${monty.class:tbp.monty.frameworks.actions.actions.LookDown}
              - ${monty.class:tbp.monty.frameworks.actions.actions.TurnLeft}
              - ${monty.class:tbp.monty.frameworks.actions.actions.TurnRight}
            _target_: tbp.monty.frameworks.models.motor_policies.NaiveScanPolicy
            use_goal_driven_actions: false
            agent_id: agent_id_0
            fixed_amount: 5
          _target_: tbp.monty.frameworks.models.motor_policy_selectors.SinglePolicySelector
        _target_: tbp.monty.frameworks.models.motor_system.MotorSystem
      learning_modules:
        learning_module_0:
          hypotheses_updater_class: ${monty.class:tbp.monty.frameworks.models.evidence_matching.burst_sampling.BurstSamplingHypothesesUpdater}
          hypotheses_updater_args:
            max_nneighbors: 10
          _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
          max_match_distance: 0.01
          tolerances:
            patch_0:
              hsv: ${np.array:[0.1, 1, 1]}
              principal_curvatures_log: ${np.ones:2}
          feature_weights: {}
          max_graph_size: 0.3
          num_model_voxels_per_dim: 100
          max_nodes_per_graph: 2000
          gsg:
            _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
            goal_tolerances:
              location: 0.015
            elapsed_steps_factor: 10
            min_post_goal_success_steps: 5
            x_percent_scale_factor: 0.75
            desired_object_distance: 0.03
        learning_module_1:
          hypotheses_updater_class: ${monty.class:tbp.monty.frameworks.models.evidence_matching.burst_sampling.BurstSamplingHypothesesUpdater}
          hypotheses_updater_args:
            max_nneighbors: 10
          _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
          feature_weights:
            patch_1:
              hsv: ${np.array:[1, 0.5, 0.5]}
              pose_vectors: ${np.array:[0, 2, 1]}
          tolerances:
            patch_1:
              hsv: ${np.array:[0.1, 0.2, 0.2]}
          max_match_distance: 0.001
          x_percent_threshold: 20
          evidence_threshold_config: all
          max_graph_size: 0.1
          num_model_voxels_per_dim: 100
          gsg:
            _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
            goal_tolerances:
              location: 0.015
            elapsed_steps_factor: 10
            min_post_goal_success_steps: 5
            x_percent_scale_factor: 0.75
            desired_object_distance: 0.03
        learning_module_2:
          hypotheses_updater_class: ${monty.class:tbp.monty.frameworks.models.evidence_matching.burst_sampling.BurstSamplingHypothesesUpdater}
          hypotheses_updater_args:
            max_nneighbors: 10
          _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
          max_match_distance: 0.01
          tolerances:
            patch_2:
              hsv: ${np.array:[0.1, 1, 1]}
              principal_curvatures_log: ${np.ones:2}
            learning_module_0:
              object_id: 1
            learning_module_1:
              object_id: 1
          feature_weights:
            learning_module_0:
              object_id: 1
            learning_module_1:
              object_id: 1
          max_graph_size: 0.4
          num_model_voxels_per_dim: 100
          max_nodes_per_graph: 2000
          gsg:
            _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
            goal_tolerances:
              location: 0.015
            elapsed_steps_factor: 10
            min_post_goal_success_steps: 5
            x_percent_scale_factor: 0.75
            desired_object_distance: 0.03
      sensor_modules:
        sensor_module_0:
          _target_: tbp.monty.frameworks.models.sensor_modules.CameraSM
          sensor_module_id: patch_0
          features:
          - pose_vectors
          - pose_fully_defined
          - on_object
          - object_coverage
          - min_depth
          - mean_depth
          - hsv
          - principal_curvatures_log
          delta_thresholds:
            on_object: 0
            n_steps: 20
            hsv:
            - 0.1
            - 0.1
            - 0.1
            pose_vectors: ${np.list_eval:[np.pi / 4, np.pi * 2, np.pi * 2]}
            principal_curvatures_log:
            - 2
            - 2
            distance: 0.01
          save_raw_obs: true
        sensor_module_1:
          _target_: tbp.monty.frameworks.models.two_d_sensor_module.TwoDSensorModule
          sensor_module_id: patch_1
          save_raw_obs: false
          edge_detector:
            _target_: tbp.monty.frameworks.utils.edge_detection.EdgeDetector
            gaussian_sigma: 1.0
            kernel_size: 7
            strength_threshold: 0.1
            coherence_threshold: 0.5
            radius: 14.0
            sigma_r: 7.0
            depth_edge_threshold: 0.01
            max_center_offset: null
          noise_params: null
          features:
          - pose_vectors
          - pose_fully_defined
          - principal_curvatures
          - on_object
          - object_coverage
          - rgba
          - hsv
          - edge_strength
          - coherence
          - mean_depth
          - min_depth
          delta_thresholds:
            on_object: 0
            n_steps: 20
            hsv:
            - 0.1
            - 0.1
            - 0.1
            pose_vectors: ${np.list_eval:[np.pi / 4, np.pi * 2, np.pi * 2]}
            distance: 0.01
        sensor_module_2:
          _target_: tbp.monty.frameworks.models.sensor_modules.CameraSM
          sensor_module_id: patch_2
          features:
          - pose_vectors
          - pose_fully_defined
          - on_object
          - object_coverage
          - hsv
          - principal_curvatures_log
          delta_thresholds:
            on_object: 0
            n_steps: 100
            hsv:
            - 0.2
            - 0.2
            - 0.2
            pose_vectors: ${np.list_eval:[np.pi / 4, np.pi * 2, np.pi * 2]}
            principal_curvatures_log:
            - 4
            - 4
            distance: 0.05
          save_raw_obs: true
        sensor_module_3:
          _target_: tbp.monty.frameworks.models.sensor_modules.Probe
          sensor_module_id: view_finder
          save_raw_obs: true
      sm_to_agent_dict:
        patch_0: agent_id_0
        patch_1: agent_id_0
        patch_2: agent_id_0
        view_finder: agent_id_0
      sm_to_lm_matrix:
      - - 0
      - - 1
      - - 2
      lm_to_lm_matrix: null
      lm_to_lm_vote_matrix: null
    environment:
      env_init_args:
        data_path: ${path.expanduser:${oc.env:MONTY_DATA}/mujoco/objects/compositional_objects}
        agents:
        - _target_: tbp.monty.simulators.mujoco.agents.DistantAgent
          _partial_: true
          agent_id: agent_id_0
          sensor_configs:
            patch_0:
              _target_: tbp.monty.frameworks.sensors.SensorConfig
              resolution:
                width: 64
                height: 64
              zoom: 10.0
            patch_1:
              _target_: tbp.monty.frameworks.sensors.SensorConfig
              resolution:
                width: 64
                height: 64
              zoom: 30.0
            patch_2:
              _target_: tbp.monty.frameworks.sensors.SensorConfig
              resolution:
                width: 64
                height: 64
              zoom: 5.0
            view_finder:
              _target_: tbp.monty.frameworks.sensors.SensorConfig
              resolution:
                width: 64
                height: 64
              zoom: 1.0
          position:
          - 0.0
          - 1.5
          - 0.2
        raise_actuate_missing: false
      env_init_func: ${monty.class:tbp.monty.simulators.mujoco.MuJoCoSimulator}
      transform:
      - _target_: tbp.monty.frameworks.environment_utils.transforms.GaussianBlurRGB
        agent_id: agent_id_0
        sigma: 5
        sensor_ids:
        - patch_1
      - _target_: tbp.monty.frameworks.environment_utils.transforms.MissingToMaxDepth
        agent_id: agent_id_0
        max_depth: 1
      - _target_: tbp.monty.frameworks.environment_utils.transforms.DepthTo3DLocations
        agent_id: agent_id_0
        sensor_ids:
        - patch_0
        - patch_1
        - patch_2
        - view_finder
        resolutions:
        - - 64
          - 64
        - - 64
          - 64
        - - 64
          - 64
        - - 64
          - 64
        world_coord: true
        zooms:
        - 10.0
        - 30.0
        - 5.0
        - 1.0
        get_all_points: true
        use_semantic_sensor: false
    train_env_interface_args:
